name: Build SM6115 Kernel With BakaSU, NoMount and SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison cpio curl flex git \
            libncurses-dev libssl-dev \
            make python3 rsync zstd

      - name: Install Neutron Clang
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fLo antman \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S
          test -x bin/clang
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

          ./antman --patch=glibc
          ./antman -I
          bin/clang --version
          bin/ld.lld --version

      - name: Clone Custom Kernel Source
        run: |
          set -euo pipefail
          git clone --depth=1 \
            --branch lineage-24.0 \
            https://github.com/robot360-upload/android_kernel_samsung_sm6115 \
            kernel

      - name: Update and Initialize Git submodules
        run: |
          set -euo pipefail
          git -C kernel submodule update --init --recursive --remote
          
      - name: Disable automatic kernel version suffix
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/setlocalversion")
          text = path.read_text()

          pattern = (
              r'(?m)^([ \t]*)if test "\$\{LOCALVERSION\+set\}" != "set"; then\n'
              r'[ \t]*scm=\$\(scm_version --short\)\n'
              r'[ \t]*res="\$res\$\{scm:\+\+\}"\n'
              r'[ \t]*fi'
          )

          updated, count = re.subn(pattern, r'\1:', text, count=1)

          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one suffix block; found {count}"
              )

          path.write_text(updated)
          print("Automatic '+' suffix disabled.")
          PY

          git diff --check

      - name: Enable DroidSpaces kernel support
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"

          test -f "$CONFIG" || {
            echo "::error::Config file not found: $CONFIG"
            exit 1
          }

          FRAGMENT="$(mktemp)"
          PATCH="$(mktemp)"
          trap 'rm -f "$FRAGMENT" "$PATCH"' EXIT

          cat > "$FRAGMENT" <<'EOF'
          # Kernel configurations for full DroidSpaces support
          # Copyright (C) 2026 ravindu644 <droidcasts@protonmail.com>

          # IPC mechanisms
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Core namespace support
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y

          # Seccomp support
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Control groups support
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          # Resource limits
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          # Device filesystem support
          CONFIG_DEVTMPFS=y

          # Overlay filesystem support
          CONFIG_OVERLAY_FS=y

          # TMPFS ACL and xattr
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Firmware loading support
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # DroidSpaces network isolation
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y

          # Legacy IPv4 compatibility
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y

          # IPv6 NAT support
          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y

          # Legacy IPv6 compatibility
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NF_NAT_IPV6=y

          # Macvlan networking
          CONFIG_MACVLAN=y

          # Android network compatibility
          CONFIG_ANDROID_PARANOID_NETWORK=n

          # User namespaces
          CONFIG_USER_NS=y
          EOF

          # Replace existing definitions instead of creating duplicates.
          python3 - "$CONFIG" "$FRAGMENT" <<'PY'
          import re
          import sys

          config, fragment = sys.argv[1:3]

          with open(fragment) as f:
              additions = f.read()

          symbols = set(re.findall(
              r'^(CONFIG_[A-Za-z0-9_]+)=',
              additions,
              re.MULTILINE
          ))

          with open(config) as f:
              original = f.readlines()

          pattern = re.compile(
              r'^(?:CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)'
          )

          result = []
          for line in original:
              match = pattern.match(line)
              if match:
                  symbol = re.match(r'(?:CONFIG_[A-Za-z0-9_]+|# (CONFIG_[A-Za-z0-9_]+))', line)
                  if symbol:
                      name = symbol.group(1) or symbol.group(2)
                      if name in symbols:
                          continue
              result.append(line)

          with open(config, 'w') as f:
              f.writelines(result)
              if result and not result[-1].endswith('\n'):
                  f.write('\n')
              f.write('\n')
              f.write(additions)
          PY

          echo "DroidSpaces configuration added."

          # Download upstream compatibility patch.
          PATCH_URL="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"

          curl -fLsS --retry 3 "$PATCH_URL" -o "$PATCH"

          # Apply only if not already applied.
          if git apply --check "$PATCH"; then
              git apply "$PATCH"
              echo "Cgroup compatibility patch applied."
          elif git apply --reverse --check "$PATCH"; then
              echo "Cgroup compatibility patch already applied."
          else
              echo "::error::Cgroup compatibility patch cannot be applied."
              exit 1
          fi

          echo "DroidSpaces setup completed."
      - name: Check source formatting
        working-directory: kernel
        run: |
          set -euo pipefail
          git diff --check

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config

          scripts/config --file out/.config \
            --enable MODVERSIONS \
            --set-str LOCALVERSION "-perf-gcbd2ed85b026" \
            --disable LOCALVERSION_AUTO

          make O=out olddefconfig

          echo "=== Final kernel configuration ==="
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KSU_SUSFS_SUS_PATH|KSU_SUSFS_SUS_MOUNT|KSU_SUSFS_SUS_KSTAT|KSU_SUSFS_SPOOF_UNAME|KSU_SUSFS_ENABLE_LOG|KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS|KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG|KSU_SUSFS_OPEN_REDIRECT|KSU_SUSFS_SUS_MAP|MODVERSIONS|LOCALVERSION|LOCALVERSION_AUTO)=' out/.config

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' out/.config

          grep -q '^CONFIG_MODVERSIONS=y$' out/.config
          grep -q '^CONFIG_LOCALVERSION="-perf-gcbd2ed85b026"$' out/.config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' out/.config
      - name: Build uncompressed Image
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          clang --version
          make O=out -j"$(nproc)" Image

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T505-SM6115-KernelSU-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          if-no-files-found: error
          retention-days: 7
